name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...

      # The Postgres and the two Redis a developer runs, from the compose file.
      # --wait returns once their healthchecks pass.
      - run: make db-up

      # -race from the start: the usage writer brings goroutines and channels
      # this week, and data races rarely show up as plain test failures.
      # make test is go test -race ./... with the URLs of the three services
      # above set, so the Postgres and Redis tests run here instead of skipping.
      - run: make test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pinned: a new release can add findings and turn CI red by itself.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  # The whole stack, started the way a developer starts it: from the repo root,
  # where compose.yaml includes deployments/docker-compose.yml. There is no Go
  # setup here, because the images build in Docker.
  #
  # Don't run this job with act. It would run on your own Docker daemon, where
  # the last step removes your dev stack and its database volume.
  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Builds the gateway and the mock provider, then waits: migrate has to
      # exit 0 and every other service has to be running, or healthy where it
      # has a healthcheck. The gateway has none, so seed.sh below waits for its
      # /ready.
      - run: docker compose up -d --build --wait

      # seed.sh prints one line per tenant, name<TAB>tenant_id<TAB>key. They go
      # to a file, which keeps the keys out of the log.
      - run: scripts/seed.sh > "$RUNNER_TEMP/seed.tsv"

      # seed-default's key, the third column of its line, is smoke.sh's key.
      - run: |
          SMOKE_KEY=$(awk -F'\t' '$1 == "seed-default" { print $3 }' "$RUNNER_TEMP/seed.tsv") scripts/smoke.sh

      # What every container printed, to find out why a step above failed.
      - if: failure()
        run: docker compose logs

      # The runner is its own machine and is thrown away after the job, so this
      # only tidies up; -v removes the database volume too.
      - if: always()
        run: docker compose down -v
