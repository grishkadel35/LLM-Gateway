name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres for the migration tests. It matches the compose
    # image; the database tests create and drop their own databases inside it.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

      # A throwaway Redis for the rate-limit tests. It matches the compose
      # image; each test uses its own tenant ID, so tests never share keys.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      # Set, so the Postgres and Redis tests run here instead of skipping.
      DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway?sslmode=disable
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...

      # -race from the start: the usage writer brings goroutines and channels
      # this week, and data races rarely show up as plain test failures.
      - run: go test -race ./...
