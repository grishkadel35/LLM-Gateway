# Points every provider at cmd/mockprovider, so the full gateway can run with
# no real API keys and no spend. Provider names match config.yaml, so client
# base URLs are identical to production.
#
#   make mock        # terminal 1: mock provider on 127.0.0.1:9090
#   make run-mock    # terminal 2: gateway on 127.0.0.1:8080 using this file
#
# The mock only checks that each credential header is present, so any value
# works. run-mock sets MOCK_API_KEY for you.

port: 8080
host: 127.0.0.1

providers:
  openai:
    url: http://127.0.0.1:9090
    key: ${MOCK_API_KEY}
    auth: bearer

  anthropic:
    url: http://127.0.0.1:9090
    key: ${MOCK_API_KEY}
    auth: x-api-key
    headers:
      anthropic-version: "2023-06-01"

  gemini:
    url: http://127.0.0.1:9090
    key: ${MOCK_API_KEY}
    auth: x-goog-api-key
