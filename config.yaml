# llm-gateway configuration.
#
# Any key you leave out falls back to the default shown in the comment.
#
# API keys are NEVER written here. This file is committed to git. Keys are
# environment references, expanded at startup; an unset variable is a startup
# error, not a surprise 401 on the first request.

# Port the gateway itself listens on.
port: 8080

# Address to bind to. Loopback by default and on purpose: the gateway holds
# real provider keys. Tenant keys guard them, but there is no TLS or rate
# limiting yet, so binding wider is a deliberate choice, not a default.
host: 127.0.0.1

# Each provider is reachable at /<name>/... — point your client's base URL at
# the prefix and it speaks that provider's native API, unchanged. Adding a
# provider is config only; no code changes.
#
#   OpenAI SDK   → base_url = "http://127.0.0.1:8080/openai/v1"
#   Anthropic SDK→ base_url = "http://127.0.0.1:8080/anthropic"
#
# auth selects how the key is presented: bearer | x-api-key | x-goog-api-key
# timeout is how long to wait for the provider to start responding, in seconds.
# It is a response-header timeout, so streaming replies may run longer. A
# non-streaming reply sends no headers until generation finishes, so this has
# to cover the whole generation; 600 matches the official SDKs' default.
providers:
  openai:
    url: https://api.openai.com
    timeout: 600
    key: ${OPENAI_API_KEY}
    auth: bearer

  anthropic:
    url: https://api.anthropic.com
    timeout: 600
    key: ${ANTHROPIC_API_KEY}
    auth: x-api-key
    headers:
      anthropic-version: "2023-06-01"

  gemini:
    url: https://generativelanguage.googleapis.com
    timeout: 600
    key: ${GEMINI_API_KEY}
    auth: x-goog-api-key

  # Groq serves an OpenAI-compatible API under a base path. Same auth style as
  # OpenAI, different URL — proving a new provider of this kind is pure config.
  groq:
    url: https://api.groq.com/openai
    timeout: 600
    key: ${GROQ_API_KEY}
    auth: bearer
