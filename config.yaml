# llm-gateway configuration.
#
# Any key you leave out falls back to the default shown in the comment.
#
# API keys are NEVER written here. This file is committed to git. Keys are
# environment references, expanded at startup; an unset variable is a startup
# error, not a surprise 401 on the first request.
#
# A provider's url, timeout, max_concurrency, queue_timeout and
# fallback.enabled may be environment references too, and may carry a
# default: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434} is the variable when it
# is set and non-empty, the default otherwise. A key never takes a default:
# that would be a literal key in git.

# Port the gateway itself listens on.
port: 8080

# Address to bind to. Loopback by default and on purpose: the gateway holds
# real provider keys. Tenant keys guard them, but there is no TLS or rate
# limiting yet, so binding wider is a deliberate choice, not a default.
host: 127.0.0.1

# Each provider is reachable at /<name>/... — point your client's base URL at
# the prefix and it speaks that provider's native API, unchanged. Adding a
# provider is config only; no code changes.
#
#   OpenAI SDK   → base_url = "http://127.0.0.1:8080/openai/v1"
#   Anthropic SDK→ base_url = "http://127.0.0.1:8080/anthropic"
#
# auth selects how the key is presented: bearer | x-api-key | x-goog-api-key,
# or none for a keyless upstream, which then has no key line.
# format is the API shape the provider speaks: openai | anthropic | gemini. It
# decides how usage is read; OpenAI-compatible providers like Groq are openai.
# timeout is how long to wait for the provider to start responding, in seconds.
# It is a response-header timeout, so streaming replies may run longer. A
# non-streaming reply sends no headers until generation finishes, so this has
# to cover the whole generation; 600 matches the official SDKs' default.
providers:
  openai:
    url: https://api.openai.com
    timeout: 600
    key: ${OPENAI_API_KEY}
    auth: bearer
    format: openai

  anthropic:
    url: https://api.anthropic.com
    timeout: 600
    key: ${ANTHROPIC_API_KEY}
    auth: x-api-key
    format: anthropic
    headers:
      anthropic-version: "2023-06-01"

  gemini:
    url: https://generativelanguage.googleapis.com
    timeout: 600
    key: ${GEMINI_API_KEY}
    auth: x-goog-api-key
    format: gemini

  # Groq serves an OpenAI-compatible API under a base path. Same auth style as
  # OpenAI, different URL — proving a new provider of this kind is pure config.
  groq:
    url: https://api.groq.com/openai
    timeout: 600
    key: ${GROQ_API_KEY}
    auth: bearer
    format: openai

  # Ollama on this machine: keyless and local, though clients still need a
  # gateway key. The timeout is a response-header timeout, so it has to cover
  # a whole non-streaming generation, model load included.
  ollama:
    url: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
    timeout: ${OLLAMA_TIMEOUT_SECONDS:-120}
    auth: none
    format: openai
    # Every usage row costs exactly 0; its tokens are still recorded.
    free: true
    # A local model serves few requests at once. Beyond max_concurrency in
    # flight, a request waits up to queue_timeout seconds for a slot, then gets
    # 503 with Retry-After. max_concurrency 0, the default, means no cap.
    max_concurrency: ${OLLAMA_MAX_CONCURRENCY:-1}
    queue_timeout: ${OLLAMA_QUEUE_TIMEOUT_SECONDS:-30}
    # GET every 15 seconds; /health and gateway_provider_up report the result.
    health_path: /api/tags
    # Off unless OLLAMA_FALLBACK_ENABLED is true. When Ollama is unreachable,
    # times out or answers 5xx, a non-streaming request for a model listed
    # here is retried on groq as the model it maps to. A streaming request, a
    # 4xx or a full queue never falls back.
    fallback:
      enabled: ${OLLAMA_FALLBACK_ENABLED:-false}
      provider: groq
      models:
        "qwen3.5:9b": qwen/qwen3.8-27b
