# Local dev stack: Postgres, two Redis, the gateway with its migration and a
# mock provider, and Prometheus and Grafana. There are two ways to run it.
#
# All in compose, from the repo root (compose.yaml there includes this file):
#
#   docker compose up -d --build --wait   # build the images and start everything
#   docker compose stop                   # stop everything, removing nothing
#
# Or the gateway on your Mac, with only its dependencies in compose:
#
#   make db-up      # start Postgres and the two Redis and wait until they are healthy
#   make migrate    # apply schema migrations
#   make obs-up     # start Prometheus and Grafana and wait until both are healthy
#   make mock       # the mock provider, in its own terminal
#   make run-mock   # the gateway, in another
#   make obs-down   # stop Prometheus and Grafana
#   make db-down    # stop everything (Postgres data survives in the pgdata volume)
#
# The gateway in compose and a gateway on your Mac both want port 8080, so run
# one at a time: `docker compose stop gateway` before `make run-mock`.

# Without a name, Compose would call the project "deployments", after this
# file's directory.
name: llm-gateway

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gateway
      # Dev-only default. The port below is bound to loopback, so nothing off
      # this machine can reach the database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: gateway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data in a version-specific directory under
      # /var/lib/postgresql, so the volume mounts the parent, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gateway", "-d", "gateway"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    # The rate limiter's buckets and the response cache: the gateway's
    # REDIS_URL. The budget ledgers are in redis-budget, below. Eviction is
    # safe for what is held here: past the 256 MB cap, allkeys-lru drops the
    # least recently used key, and an evicted cache entry is only a miss,
    # while an evicted rate-limit bucket starts full again.
    image: redis:8-alpine
    # No snapshots: a restart starts empty, and nothing here is worth keeping.
    # The password is a dev-only default, like Postgres'. The port below is
    # bound to loopback, so nothing off this machine can reach it anyway.
    command:
      - redis-server
      - --save
      - ""
      - --requirepass
      - "${REDIS_PASSWORD:-gateway}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      # redis-cli reads its password from here, so the healthcheck below needs
      # no -a, which would put the password on the command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-gateway}
    # Bound to loopback like Postgres, so nothing off this machine can reach it.
    ports:
      - "127.0.0.1:6379:6379"
    # No volume: everything here can be lost. Rate-limit buckets refill, and
    # cached answers are fetched again.
    healthcheck:
      # redis-cli exits 0 even when Redis answers NOAUTH or WRONGPASS, so the
      # check looks for PONG in what it prints: a missing or wrong password
      # fails it.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis-budget:
    # The budget ledgers and their missed counters, and nothing else: the
    # gateway's BUDGET_REDIS_URL. Every one of those keys has a TTL, so any
    # eviction policy, the volatile-* ones too, could drop a ledger, and the
    # rebuild from Postgres can't see the reservations in flight at that
    # moment. So noeviction: Redis never drops a key. At the 64 MB cap it
    # refuses writes instead. A reservation then fails, and a paid request
    # gets the gateway's 503 budget_unavailable: a budget that can't be
    # checked is never waved through. The gateway itself refuses to start with
    # a ledger Redis that has a cap and can evict.
    image: redis:8-alpine
    # No snapshots. A snapshot restored after a crash would bring back an
    # older, lower spent in every budget ledger. With none, a restart starts
    # empty, and each ledger is rebuilt from usage_logs in Postgres.
    command:
      - redis-server
      - --save
      - ""
      - --requirepass
      - "${REDIS_PASSWORD:-gateway}"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    environment:
      # As for redis: the healthcheck authenticates through this.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-gateway}
    # Bound to loopback like Postgres. On the host it is 6380, since redis
    # holds 6379.
    ports:
      - "127.0.0.1:6380:6379"
    # No volume: a restart rebuilds the ledgers from Postgres.
    healthcheck:
      # As for redis: a missing or wrong password fails it.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    # Applies the schema and exits; the gateway starts once it has succeeded.
    # The gateway's image holds /migrate too, so this service reuses the image
    # the gateway builds, by name, and builds nothing itself.
    image: llm-gateway:dev
    # The name exists only as a local build. Without this, a first `up --build`
    # tries Docker Hub for it before building, and prints a pull error.
    pull_policy: never
    entrypoint: ["/migrate"]
    environment:
      # Written out, with only the password interpolated: a .env copied from
      # .env.example sets DATABASE_URL to 127.0.0.1, which inside a container is
      # the container itself.
      DATABASE_URL: postgres://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  mockprovider:
    # Fake OpenAI, Groq, Anthropic and Gemini APIs, so the gateway below runs
    # with no real keys. No published port: only the gateway talks to it, over
    # the compose network. `make mock` starts the same server on the host.
    image: llm-gateway-mock:dev
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: mockprovider

  gateway:
    # Like migrate and mockprovider it has no healthcheck: the images are
    # distroless, with no shell or wget to run one. `--wait` only waits for it to
    # be running; GET /ready is the real check.
    image: llm-gateway:dev
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-budget:
        condition: service_healthy
      mockprovider:
        condition: service_started
    environment:
      # Dev-only default, like Postgres'. The port below is bound to loopback,
      # so nothing off this machine can reach the admin API. Prometheus is given
      # the same key (see the configs block below).
      GATEWAY_ADMIN_KEY: ${GATEWAY_ADMIN_KEY:-mock-admin-key-for-local-testing-only}
      # These URLs are written out, with only the passwords interpolated. A .env
      # copied from .env.example sets DATABASE_URL, REDIS_URL, BUDGET_REDIS_URL
      # and OLLAMA_BASE_URL to 127.0.0.1, which inside a container is the
      # container itself.
      DATABASE_URL: postgres://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-gateway}@redis:6379/0
      BUDGET_REDIS_URL: redis://:${REDIS_PASSWORD:-gateway}@redis-budget:6379/0
      # config.compose.yaml names it as every mock provider's key. The mock only
      # checks that a key is present, so any value works.
      MOCK_API_KEY: mock
      # Ollama runs on your Mac, not in compose.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    # Colima already resolves host.docker.internal, for the Ollama URL above;
    # Linux Docker needs this line.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The image has no config of its own; this one points the providers at the
      # mock.
      - ./config.compose.yaml:/etc/llm-gateway/config.yaml:ro
    # Bound to loopback like Postgres. The metrics port, 9091, is not published:
    # Prometheus reaches it over the compose network.
    ports:
      - "127.0.0.1:8080:8080"

  prometheus:
    # The newest stable release on github.com/prometheus/prometheus/releases,
    # checked 2026-10-31.
    image: prom/prometheus:v3.15.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # The gateway's admin key, which /metrics requires, as a file at
    # /run/secrets/gateway_admin_key. See the configs block below.
    configs:
      - source: gateway_admin_key
        target: /run/secrets/gateway_admin_key
    # prometheus.yml scrapes the gateway on the host as well as the one in
    # compose. Colima already resolves host.docker.internal; Linux Docker needs
    # this line.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The mock provider holds 9090 on the host, so Prometheus is on 9092. Bound
    # to loopback like Postgres and Redis.
    ports:
      - "127.0.0.1:9092:9090"
    # No volume, like Redis: the data lasts until `docker compose down`.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 5s
      retries: 15

  grafana:
    # The newest stable release on github.com/grafana/grafana/releases, checked
    # 2026-10-31.
    image: grafana/grafana:13.3.0
    environment:
      # Dev-only default, like Postgres'. The port below is bound to loopback,
      # so nothing off this machine can reach the login.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anyone who reaches the port may view the dashboard without a login,
      # which also lets a headless browser take its screenshot.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Only the two folders Grafana provisions from, so its other, empty
      # provisioning folders stay in place: without them it logs an error for
      # each. The first holds the dashboard provider and dashboard.json; its
      # datasources folder is not read there.
      - ./grafana:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3000:3000"
    # No volume either: nothing here is worth keeping, since the datasource and
    # the dashboard are provisioned from the repo.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:

configs:
  # Built from your environment when the container is created, so the key is
  # never in git or in a file in the repo. With GATEWAY_ADMIN_KEY unset it is
  # the mock's key, which is also the gateway's default. A config, not a secret:
  # Compose stops `up` when a secret's variable is unset, and this has to start
  # without one.
  gateway_admin_key:
    content: "${GATEWAY_ADMIN_KEY:-mock-admin-key-for-local-testing-only}"
