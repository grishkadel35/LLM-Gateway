# Local dev stack. Week 3: Postgres and Redis; later weeks add Prometheus,
# Grafana and the gateway itself.
#
#   make db-up      # start Postgres and Redis and wait until both are healthy
#   make migrate    # apply schema migrations
#   make db-down    # stop them (Postgres data survives in the pgdata volume)

# Without a name, Compose would call the project "deployments", after this
# file's directory.
name: llm-gateway

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gateway
      # Dev-only default. The port below is bound to loopback, so nothing off
      # this machine can reach the database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: gateway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data in a version-specific directory under
      # /var/lib/postgresql, so the volume mounts the parent, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gateway", "-d", "gateway"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8-alpine
    # Bound to loopback like Postgres, so nothing off this machine can reach it.
    ports:
      - "127.0.0.1:6379:6379"
    # No volume: the rate-limit buckets are disposable, and losing them only
    # refills every tenant.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
